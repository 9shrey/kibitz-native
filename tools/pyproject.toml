[project]
name = "kibitz-native-tools"
version = "0.1.0"
description = "Export the Kibitz evaluation network to ONNX and a raw weights file"
requires-python = ">=3.12,<3.13"
dependencies = ["torch", "onnx", "onnxscript", "onnxruntime>=1.30", "chess", "numpy"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
